<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismPack wording editor</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#d9d9de;--accent:#0a66ff;--ok:#1a8a3c;--okbg:#e6f6ea;--edit:#b36b00;--editbg:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2a2a2d;--ink:#f2f2f4;--mute:#9a9aa1;--line:#3d3d42;--accent:#4c8dff;--ok:#5fd27c;--okbg:#1d3a27;--edit:#ffb84d;--editbg:#3b2f17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 auto 0 0}
.count{color:var(--mute);font-size:13px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(.97)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:20px}
nav{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav a{color:var(--ink);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:14px}
nav a:hover{background:var(--card)}
nav small{color:var(--mute);display:block}
section{margin-bottom:34px}
section h2{margin:0 0 4px;font-size:20px}
.hint{color:var(--mute);margin:0 0 14px;font-size:13px}
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.field.locked{border-color:var(--ok);background:color-mix(in srgb,var(--okbg) 40%,var(--card))}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.top label.t{font-weight:600;font-size:13px;flex:1}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;display:none}
.tag.edit{display:inline-block;background:var(--editbg);color:var(--edit)}
textarea{width:100%;resize:none;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:transparent;color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.mono{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.lock{font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center;cursor:pointer}
.mini{font-size:12px;padding:3px 8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>PrismPack wording editor</h1>
  <span class="count" id="count"></span>
  <button id="copy" class="primary">Copy everything for Claude</button>
  <button id="dl">Download JSON</button>
  <button id="wipe">Start over</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
const SECTIONS = [{"id": "popup", "title": "Rename pop-up", "hint": "Round 2. Your locked wording is applied, plus the accuracy fixes from my review. Paragraph 2 now explains the name by the scope of 2.0 instead of the search for a name.", "fields": [{"id": "popup.headline", "label": "Headline", "text": "UpdateScout is now PrismPack!", "multiline": false, "mono": false}, {"id": "popup.p1", "label": "Paragraph 1: what 2.0 is", "text": "Version 2.0 is much more than an updater. Alongside updates, PrismPack now helps you find and install new apps, and look after the software you already have.", "multiline": true, "mono": false}, {"id": "popup.p2", "label": "Paragraph 2: why the name (rewritten, positive)", "text": "With that much scope, the name UpdateScout no longer fit, so the app grew into PrismPack. We chose PrismPack because a prism takes a single beam of white light and reveals every colour inside it. PrismPack does the same for your Mac: one window that shows all your software, the files deleted apps leave behind, and a place to discover and install new software, each in its own colour.", "multiline": true, "mono": false}, {"id": "popup.p3", "label": "Paragraph 3: what carried over", "text": "Your settings and history carried over. Because macOS treats PrismPack as a new app, it asks again for notifications and Full Disk Access (optional).", "multiline": true, "mono": false}, {"id": "popup.title", "label": "List heading", "text": "What's new in 2.0", "multiline": false, "mono": false}, {"id": "popup.button", "label": "Button", "text": "Continue", "multiline": false, "mono": false}, {"id": "banner.text", "label": "Banner on the Updates page", "text": "UpdateScout is now PrismPack", "multiline": false, "mono": false}, {"id": "banner.link", "label": "Banner link", "text": "See what's new", "multiline": false, "mono": false}]}, {"id": "whatsnew", "title": "What's new in 2.0 (the list in the pop-up)", "hint": "Grouped from 21 entries to 14 (merged: Uninstall + Orphaned App Files + Full Disk Access; Several updates + One password + Progress; Installed + Duplicates; Stable/Beta + Automatic + Hide; GitHub + custom sources; A new window + A calmer window). Added what was missing: custom sources, Setup list, macOS updates, ⌘Q, Theme, release notes. Two sentences depend on features awaiting your OK: the Settings beta switch and the in-app release notes.", "fields": [{"id": "wn.0", "label": "A new window", "text": "One window with a sidebar: Updates, Installed, Orphaned App Files, Discover, Activity and Settings, in the Liquid Glass look on macOS 26 and later, with a simpler look on earlier versions. Settings is a page, not a separate window, and an app's details open as a pop-up. Updates, Installed and Discover can be cards or a list, remembered for each page, and you can choose a Light, Dark or System theme.", "multiline": true, "mono": false, "title": "A new window"}, {"id": "wn.1", "label": "A new menu bar prism", "text": "Click the prism and the window opens straight away: the small pop-up has been removed. Right-click the prism for Check Now, Settings and Quit. ⌘Q asks first, and Close Window keeps PrismPack running in the menu bar.", "multiline": true, "mono": false, "title": "A new menu bar prism"}, {"id": "wn.2", "label": "Discover", "text": "Find and install new apps and tools from Homebrew, npm, PyPI, crates.io, RubyGems and the editor extension stores. Fonts can even be installed right from Discover! Browse what's popular this month, what's new, and apps by category. Each app's page shows its own description and pictures, and fonts show a preview and every style.", "multiline": true, "mono": false, "title": "Discover"}, {"id": "wn.3", "label": "More kinds of updates", "text": "New sections for Python (pipx and uv), npm, Rust, Ruby gems, and extensions for VS Code, VSCodium and Cursor, plus a Tools section for the package managers themselves. Apple's own apps show up as macOS updates, handled by Software Update. Update cards preview the release notes and warn about major upgrades and restarts.", "multiline": true, "mono": false, "title": "More kinds of updates"}, {"id": "wn.4", "label": "Faster, clearer updates", "text": "Updates run simultaneously, each with its own progress and Cancel, while each package manager still does one thing at a time. Choose how many can update at a time in Settings. Enter the system password once for a whole batch; it's kept in memory for that batch only and never saved to the app or your device. Installs and updates show a bar and a percent while a download can be measured, and the step they're on (verifying, installing…). When nothing can be measured, it says so.", "multiline": true, "mono": false, "title": "Faster, clearer updates"}, {"id": "wn.5", "label": "Installed and Duplicates", "text": "Everything on your Mac in one list, showing where each item came from and whether it's up to date. Filter by source and sort by name, size, date or type. Find an unneeded or outdated app? Update it, or move it to the Trash, from its details. Two copies of one app, or an App Store app Homebrew also tracks, are shown side by side with their versions, sizes and how often you open each. Keep Homebrew's copy in one click. Nothing is removed without asking, and copies go to the Trash.", "multiline": true, "mono": false, "title": "Installed and Duplicates"}, {"id": "wn.6", "label": "Move apps under Homebrew", "text": "PrismPack spots apps nothing keeps up to date that Homebrew could, checks that Homebrew is really better for each one, and moves it only when you click. You can undo it later.", "multiline": true, "mono": false, "title": "Move apps under Homebrew"}, {"id": "wn.7", "label": "Uninstall and clean-up", "text": "Remove an app or package from its details, the right way for wherever it came from. Before anything moves, one window shows the app, the files it left in your Library, and Homebrew's cleanup list. You choose what goes, and it goes to the Trash so you can put it back. Orphaned App Files lists what apps you already removed left behind, with their size and when they last changed. Nothing is ticked: keep them, move what you choose to the Trash, or tell PrismPack which app a file belongs to. Optional Full Disk Access lets PrismPack clear the app data folders macOS protects; Settings → Setup helps you turn it on.", "multiline": true, "mono": false, "title": "Uninstall and clean-up"}, {"id": "wn.8", "label": "You decide what updates", "text": "Choose which release track each app follows, Stable or Beta, on its details. Automatic updates are off until you turn them on: updates install on their own after a check, optionally only on Wi-Fi or Ethernet, and never for anything that needs your password, apps that are open, macOS, betas or major upgrades. Hide one version, every update from an app, or only its major upgrades. Hidden updates don't appear in the list, don't send notifications, and Update All skips them.", "multiline": true, "mono": false, "title": "You decide what updates"}, {"id": "wn.9", "label": "Apps on GitHub, and your own sources", "text": "Link an app that publishes its releases on GitHub, from Settings or the app's page. Only a download signed by the same developer is installed; apps that aren't signed need a clear OK first. You can also add your own source: a web page with a version number, or a command PrismPack runs. It's tested before it's saved.", "multiline": true, "mono": false, "title": "Apps on GitHub, and your own sources"}, {"id": "wn.10", "label": "Activity", "text": "A history of checks, updates, installs and removals, with search and filters. It stays until you delete it. Failures keep their log, and you can retry them.", "multiline": true, "mono": false, "title": "Activity"}, {"id": "wn.11", "label": "Settings you can search", "text": "Settings has a search field. Setup lists the tools PrismPack uses, such as Homebrew, mas, pipx, Node and Rust, and can install or reinstall them. Release notes for this version and earlier ones are one click away, pulled from GitHub.", "multiline": true, "mono": false, "title": "Settings you can search"}, {"id": "wn.12", "label": "Light on memory", "text": "PrismPack idles at about 15 MB in the menu bar. Closing the window frees much of what it was using, such as Discover's catalogue and pictures.", "multiline": true, "mono": false, "title": "Light on memory"}, {"id": "wn.13", "label": "Betas for testers", "text": "Turn on Beta versions in Settings to try new versions of PrismPack early. Everyone else only gets full releases.", "multiline": true, "mono": false, "title": "Betas for testers"}]}, {"id": "notes", "title": "Release notes for 2.0.0 beta (draft, now extensive)", "hint": "The GitHub text is long on purpose. The Sparkle text is the shorter version of the same. Both mention the beta and rely on the Settings beta switch and in-app release notes being built (marked in my message).", "fields": [{"id": "notes.html", "label": "Sparkle window (HTML; keep <b>, <ul>, <li>, <p>)", "text": "<p><b>PrismPack 2.0 beta.</b> UpdateScout is now PrismPack, and it does much more than update.</p>\n<ul>\n<li><b>New name, same app.</b> Your settings, history, hidden lists and background check carry over. The app renames itself to PrismPack.app, and because macOS sees a new app it asks again for notifications and Full Disk Access (optional).</li>\n<li><b>A new window:</b> a sidebar with Updates, Installed, Orphaned App Files, Discover, Activity and Settings, in the Liquid Glass look on macOS 26 and later (simpler on macOS 15). Cards or a list on the main pages.</li>\n<li><b>Discover:</b> find and install new apps, tools, fonts and extensions from Homebrew, npm, PyPI, crates.io, RubyGems and the editor stores, with descriptions, pictures and font previews.</li>\n<li><b>More updates:</b> Python (pipx and uv), npm, Rust, Ruby gems, VS Code, VSCodium and Cursor extensions, Apple's own apps through Software Update, and your own sources.</li>\n<li><b>Faster, clearer installs:</b> several updates at once, one password per batch, and a progress bar with a percent and a step line.</li>\n<li><b>Installed, Duplicates and Uninstall:</b> everything on your Mac in one list, two copies of an app compared side by side, and removal to the Trash with the files an app left behind.</li>\n<li><b>Orphaned App Files</b> and optional <b>Full Disk Access</b> to clear what macOS protects.</li>\n<li><b>You decide:</b> Stable or Beta per app, automatic updates (off until you turn them on), and more ways to hide updates.</li>\n<li><b>Settings:</b> search, a tool list with Install and Reinstall, and release notes for every version.</li>\n<li><b>Light on memory:</b> about 15 MB in the menu bar, and closing the window frees much of what it was using.</li>\n</ul>\n<p>This is a beta. Full details are on the GitHub release page.</p>", "multiline": true, "mono": true}, {"id": "notes.md", "label": "GitHub release page (Markdown, extensive)", "text": "> **This is a beta.** Download it from this page: UpdateScout 1.8.0's updater does not offer betas. Once you are running it, PrismPack offers you later betas and the final 2.0.0 automatically. Please open an issue if something looks wrong.\n\n## UpdateScout is now PrismPack\n\nVersion 2.0 is much more than an updater. Alongside updates, PrismPack helps you find and install new apps, and look after the software you already have. A prism takes a single beam of white light and reveals every colour inside it; PrismPack does the same for your Mac, with each source in its own colour.\n\n**What carries over:** your settings, history, hidden updates, custom and GitHub sources, and the background check.\n\n**What to expect on first launch:**\n- The app renames itself to `PrismPack.app` in the same folder and restarts.\n- A one-time pop-up explains the new name. You can replay it from the banner on Updates.\n- Because the app has a new identity, macOS asks again for notification permission, and Full Disk Access (optional) starts over. Settings → Setup walks you through it.\n- Its data folder is now `~/Library/Application Support/PrismPack/`, and the background check runs under the new name.\n- If you use a menu bar manager such as Thaw, Ice or Bartender, the prism may need to be placed again once.\n\n## A new window\n- A sidebar with **Updates**, **Installed**, **Orphaned App Files**, **Discover**, **Activity** and **Settings**, in the Liquid Glass look on macOS 26 and later, with a simpler look on earlier versions.\n- Settings is a page, not a separate window. An app's details open as a pop-up.\n- **Cards or a list** on Updates, Installed and Discover, remembered for each page.\n- A Light, Dark or System theme.\n- The menu bar prism opens the window with a click; right-click it for Check Now, Settings and Quit. ⌘Q asks first, and Close Window keeps PrismPack running in the menu bar.\n\n## Discover\n- Find and install new apps and tools from Homebrew, npm, PyPI, crates.io, RubyGems and the editor extension stores (VS Code, VSCodium, Cursor). Fonts can be installed right from Discover.\n- Browse what's popular this month, what's new, and apps by category, with search, sorting and cards or a list.\n- Each app's page shows its own description and pictures; fonts show a preview and every style.\n\n## Updates\n- Sections for Homebrew, the Mac App Store, Sparkle apps, Python (pipx and uv), npm, Rust, Ruby gems, editor extensions, custom sources and a Tools section for the package managers. Apple's own apps are shown as macOS updates and handled by Software Update.\n- Update cards preview the release notes and warn about major upgrades, restarts and iPhone/iPad apps.\n- Updates run side by side, each with its own progress and Cancel, while each package manager still does one thing at a time. You choose how many run at once in Settings.\n- **One password per batch.** It is kept in memory for that batch only, never written to disk, and wiped when the batch ends.\n- A progress bar with a percent while a download can be measured, and a step line (verifying, installing…) otherwise. When nothing can be measured, it says so.\n\n## Installed, Duplicates and Homebrew\n- Everything on your Mac in one list, showing where each item came from and whether it is up to date. Filter by source and sort by name, size, date or type.\n- Update an app, or move it to the Trash, from its details.\n- **Duplicates:** two copies of one app, or an App Store app Homebrew also tracks, are shown side by side with versions, sizes and how often you open each. Keep Homebrew's copy in one click. Nothing is removed without asking, and copies go to the Trash.\n- **Move apps under Homebrew:** PrismPack spots apps nothing keeps up to date that Homebrew could, checks that Homebrew is really better for each one, and moves it only when you click. You can undo it later.\n\n## Uninstall and clean-up\n- Remove an app or package the right way for where it came from. One window shows the app, the files it left in your Library and Homebrew's cleanup list before anything moves. Everything goes to the Trash so you can put it back.\n- **Orphaned App Files** lists what removed apps left behind, with size and last-changed date. Nothing is ticked. Keep files, move them to the Trash, or tell PrismPack which app a file belongs to and it is offered when you move that app.\n- **Full Disk Access** is optional. It lets PrismPack clear the app data folders macOS protects, and Settings → Setup helps you turn it on.\n\n## You decide what updates\n- **Stable or Beta, per app.** Choose which release track each app follows, on its details.\n- **Automatic updates** are off until you turn them on. They install after a check, optionally only on Wi-Fi or Ethernet, and never for anything that needs your password, apps that are open, macOS, betas or major upgrades.\n- **Hide** one version, every update from an app, or only its major upgrades. Hidden updates don't appear in the list, don't send notifications, and Update All skips them.\n\n## Your own sources\n- **Apps on GitHub:** link an app that publishes its releases on GitHub, from Settings or the app's page. Only a download signed by the same developer is installed; unsigned apps need a clear OK first.\n- **Custom sources:** a web page with a version number, or a command PrismPack runs. Add one in Settings → Other sources; it is tested before it is saved.\n\n## Activity\nA history of checks, updates, installs and removals with search and filters. It stays until you delete it, and failures keep their log so you can retry them.\n\n## Settings\n- A search field that finds any setting.\n- **Setup** lists the tools PrismPack uses (Homebrew, mas, pipx, Node, Rust and more) with Install and Reinstall.\n- **Release notes** for this version and earlier ones, pulled from GitHub.\n- **Beta versions** switch to try new PrismPack releases early.\n\n## Light on memory\nPrismPack idles at about 15 MB in the menu bar. Closing the window frees much of what it was using, such as Discover's catalogue and pictures.\n\n## Requirements\n- macOS 15 or later, on a Mac with Apple silicon.\n- Developed and tested on macOS 27. macOS 15 and 26 use the same code with simpler styling; reports are welcome.\n\n## Technical notes\n- New bundle ID `com.nickszun.prismpack`, background agent `com.nickszun.prismpack.check`, data in `Application Support/PrismPack/`. The update feed and signing key are unchanged, so updates from 1.8.0 work as before.\n", "multiline": true, "mono": true}]}, {"id": "desc", "title": "App description", "hint": "Requirements added.", "fields": [{"id": "desc.formerly", "label": "Formerly line", "text": "Formerly **UpdateScout**. Version 2.0 renamed the app; settings, history and the background check carry over.", "multiline": true, "mono": false}, {"id": "desc.body", "label": "Description", "text": "A macOS app (with a menu bar prism) that finds updates across everything on the Mac, helps you find and install new apps and tools, and looks after what's already installed. Updates install only when you click, one item at a time or in a batch you start. **Automatic updates are off until you turn them on**, and never run for anything that needs your password, apps that are open, macOS, betas or major upgrades. Requires macOS 15 or later on a Mac with Apple silicon.", "multiline": true, "mono": false}, {"id": "desc.short", "label": "GitHub repo one-liner", "text": "PrismPack: a macOS menu bar app that finds updates from Homebrew, the App Store, Sparkle apps and more, and helps you find and install new ones.", "multiline": false, "mono": false}]}, {"id": "allow", "title": "Allow window (Full Disk Access)", "hint": "Unchanged.", "fields": [{"id": "allow.title", "label": "Heading", "text": "Drag this icon into the list", "multiline": false, "mono": false}, {"id": "allow.body", "label": "Explanation", "text": "macOS guards each app's data folders. Only apps you allow in System Settings may move them to the Trash for you.", "multiline": true, "mono": false}, {"id": "allow.s1", "label": "Step 1", "text": "Open System Settings. It goes straight to Privacy & Security, Full Disk Access. (In Settings' own search it is listed as \"Allow applications to access all user files\".)", "multiline": true, "mono": false}, {"id": "allow.s2", "label": "Step 2", "text": "Drag the icon above into the list, or click + and choose PrismPack, and make sure its switch is on.", "multiline": true, "mono": false}, {"id": "allow.s3", "label": "Step 3", "text": "If macOS asks, choose Quit & Reopen. PrismPack restarts in the menu bar: click the prism to open the window again.", "multiline": true, "mono": false}]}];
const KEY = "prismpack-wording-v2";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const grow = ta => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
const all = SECTIONS.flatMap(s => s.fields);
const cur = f => (saved[f.id] && saved[f.id].text != null) ? saved[f.id].text : f.text;
const isLocked = f => !!(saved[f.id] && saved[f.id].locked);
const isEdited = f => cur(f) !== f.text;

function refresh() {
  const locked = all.filter(isLocked).length, edited = all.filter(isEdited).length;
  $("#count").textContent = `${locked} of ${all.length} locked · ${edited} edited`;
  for (const s of SECTIONS) {
    const n = s.fields.filter(isLocked).length;
    $(`#nav a[href="#${s.id}"] small`).textContent = `${n} of ${s.fields.length} locked`;
  }
}
function render() {
  const nav = $("#nav"), main = $("#main");
  nav.textContent = ""; main.textContent = "";
  for (const s of SECTIONS) {
    const a = el("a"); a.href = "#" + s.id; a.append(s.title.replace(/ \(.*/, ""), el("small")); nav.append(a);
    const sec = el("section"); sec.id = s.id;
    sec.append(el("h2", "", s.title), el("p", "hint", s.hint));
    for (const f of s.fields) {
      const card = el("div", "field" + (isLocked(f) ? " locked" : ""));
      const top = el("div", "top");
      top.append(el("label", "t", f.label), el("span", "tag edit", "edited"));
      const reset = el("button", "mini", "Reset"); top.append(reset);
      const lockL = el("label", "lock"); const cb = el("input"); cb.type = "checkbox"; cb.checked = isLocked(f);
      lockL.append(cb, "Locked"); top.append(lockL);
      const ta = el("textarea", f.mono ? "mono" : ""); ta.value = cur(f); ta.rows = 1; ta.spellcheck = true;
      const upd = () => { top.querySelector(".tag").style.display = isEdited(f) ? "inline-block" : "none"; };
      ta.addEventListener("input", () => { saved[f.id] = { ...(saved[f.id] || {}), text: ta.value }; persist(); grow(ta); upd(); refresh(); });
      cb.addEventListener("change", () => { saved[f.id] = { ...(saved[f.id] || {}), locked: cb.checked }; persist(); card.classList.toggle("locked", cb.checked); refresh(); });
      reset.addEventListener("click", () => { ta.value = f.text; saved[f.id] = { ...(saved[f.id] || {}), text: f.text }; persist(); grow(ta); upd(); refresh(); });
      card.append(top, ta); sec.append(card);
      requestAnimationFrame(() => { grow(ta); upd(); });
    }
    main.append(sec);
  }
  refresh();
}
function exportText() {
  const out = ["# PrismPack wording (from the editor)", "", "Each field shows its status. LOCKED = approved as written; EDITED = changed from the app's current text.", ""];
  for (const s of SECTIONS) {
    out.push(`## ${s.title}`, "");
    for (const f of s.fields) {
      const st = [isLocked(f) ? "LOCKED" : "not locked", isEdited(f) ? "EDITED" : "unchanged"].join(", ");
      out.push(`### ${f.label} [${f.id}] (${st})`, "", "```", cur(f), "```", "");
    }
  }
  return out.join("\n");
}
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); };
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(exportText()); toast("Copied. Paste it to Claude."); }
  catch (e) { const w = window.open("", "_blank"); if (w) { w.document.write("<pre>" + exportText().replace(/</g, "&lt;") + "</pre>"); } }
});
$("#dl").addEventListener("click", () => {
  const data = all.map(f => ({ id: f.id, label: f.label, text: cur(f), locked: isLocked(f), edited: isEdited(f) }));
  const a = el("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = "prismpack-wording.json"; a.click();
});
